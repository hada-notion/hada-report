<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 리포트 관리</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #f5f6f8;
    color: #222;
    padding: 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
  th { background: #fafafa; color: #888; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  button {
    background: #6c5ce7;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  button:disabled { background: #ccc; cursor: default; }
  button.secondary { background: #eee; color: #555; margin-left: 6px; }
  a.link { color: #6c5ce7; font-size: 12px; }
  .status { font-size: 12px; color: #888; }
  .loading, .error { text-align: center; padding: 40px; color: #888; }
  .error { color: #e04b4b; }
  .toolbar { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .toolbar button { background: #333; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 학생 리포트 관리</h1>
  <div class="toolbar">
    <span id="count" class="status"></span>
    <button onclick="loadStudents()">🔄 새로고침</button>
  </div>
  <div id="app"><div class="loading">불러오는 중...</div></div>
</div>

<script>
const SUPABASE_URL = "https://xcokusmqndfbsvlwquxr.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhjb2t1c21xbmRmYnN2bHdxdXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTk0NDcsImV4cCI6MjEwMzM3NTQ0N30.0vavFiupJD1fP8o5HKwIawEQoJUc3wz-RPCtFOyJBwU"

function esc(s) {
  if (s === null || s === undefined) return ""
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]))
}

function getAdminKey() {
  let key = sessionStorage.getItem("admin_key")
  if (!key) {
    key = prompt("관리자 비밀번호를 입력하세요")
    if (key) sessionStorage.setItem("admin_key", key)
  }
  return key
}

function formatDate(iso) {
  if (!iso) return "생성 안 됨"
  const d = new Date(iso)
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`
}

function reportUrl(token) {
  return `${window.location.origin}${window.location.pathname.replace("admin.html","")}student_report.html?token=${token}`
}

async function loadStudents() {
  const app = document.getElementById("app")
  app.innerHTML = '<div class="loading">불러오는 중...</div>'
  const adminKey = getAdminKey()
  if (!adminKey) {
    app.innerHTML = '<div class="error">관리자 키가 필요합니다.</div>'
    return
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-students`, {
      headers: {
        "x-admin-key": adminKey,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
    })
    if (res.status === 401) {
      sessionStorage.removeItem("admin_key")
      app.innerHTML = '<div class="error">관리자 키가 올바르지 않습니다. 새로고침 후 다시 시도하세요.</div>'
      return
    }
    if (!res.ok) throw new Error(`서버 오류: ${res.status} ${await res.text()}`)

    const data = await res.json()
    renderTable(data.students || [])
  } catch (err) {
    app.innerHTML = `<div class="error">오류: ${esc(err.message)}</div>`
  }
}

function renderTable(students) {
  const app = document.getElementById("app")
  document.getElementById("count").textContent = `총 ${students.length}명`

  if (!students.length) {
    app.innerHTML = '<div class="error">학생 목록이 비어 있습니다. 등록(학원) DB 데이터베이스 ID 설정을 확인해주세요.</div>'
    return
  }

  app.innerHTML = `
    <table>
      <thead>
        <tr><th>학생</th><th>마지막 갱신</th><th>링크</th><th>작업</th></tr>
      </thead>
      <tbody>
        ${students.map((s, i) => `
          <tr id="row-${i}">
            <td>${esc(s.title || s.registrationId)}</td>
            <td class="status" id="updated-${i}">${formatDate(s.updatedAt)}</td>
            <td id="link-${i}">${s.accessToken ? `<a class="link" href="${reportUrl(s.accessToken)}" target="_blank">보기</a>` : "-"}</td>
            <td>
              <button id="btn-${i}" onclick='generateReport(${i}, ${JSON.stringify(s.registrationId)})'>보고서 생성</button>
              ${s.accessToken ? `<button class="secondary" onclick='copyLink(${JSON.stringify(s.accessToken)})'>링크 복사</button>` : ""}
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `
}

async function generateReport(index, registrationId) {
  const btn = document.getElementById(`btn-${index}`)
  btn.disabled = true
  btn.textContent = "생성 중..."
  const adminKey = getAdminKey()

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/sync-student-report`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ registrationId }),
    })
    if (!res.ok) throw new Error(`실패: ${res.status} ${await res.text()}`)
    const result = await res.json()

    document.getElementById(`updated-${index}`).textContent = formatDate(new Date().toISOString())
    document.getElementById(`link-${index}`).innerHTML = `<a class="link" href="${reportUrl(result.access_token)}" target="_blank">보기</a>`
    btn.textContent = "✅ 완료"
    setTimeout(() => { btn.disabled = false; btn.textContent = "보고서 생성" }, 1500)
  } catch (err) {
    alert("오류: " + err.message)
    btn.disabled = false
    btn.textContent = "보고서 생성"
  }
}

function copyLink(token) {
  navigator.clipboard.writeText(reportUrl(token))
  alert("링크가 복사되었습니다.")
}

loadStudents()
</script>
</body>
</html>
