<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 리포트 관리</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #f5f6f8;
    color: #222;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 16px; }

  /* ---------- Login screen ---------- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p { font-size: 12px; color: #888; margin: 0 0 20px; }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .login-card button {
    width: 100%;
    padding: 10px 12px;
    background: #6c5ce7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-card button:disabled { background: #ccc; cursor: default; }
  .login-error { color: #e04b4b; font-size: 12px; margin-top: 10px; min-height: 14px; }

  /* ---------- App bar ---------- */
  .app-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .app-bar h1 { font-size: 20px; margin: 0 0 2px; }
  .app-bar .last-fetch { font-size: 12px; color: #999; }
  .app-bar-actions { display: flex; gap: 8px; }
  .app-bar-actions button {
    background: #333; color: #fff; border: none; padding: 8px 14px;
    border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .app-bar-actions button.logout { background: #eee; color: #555; }

  /* ---------- Stat cards ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-card .num { font-size: 20px; font-weight: 700; }
  .stat-card .label { font-size: 11px; color: #888; margin-top: 2px; }
  .stat-card.tot .num { color: #333; }
  .stat-card.ok .num { color: #2f9e64; }
  .stat-card.stale .num { color: #d98c17; }
  .stat-card.none .num { color: #999; }
  .stat-card.fail .num { color: #e04b4b; }

  /* ---------- Filter bar ---------- */
  .filter-bar {
    background: #fff;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    position: sticky;
    top: 8px;
    z-index: 5;
  }
  .filter-bar input[type="text"] {
    flex: 1 1 200px;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
  }
  .filter-bar select {
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
  }
  .today-only-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    color: #333;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .today-only-toggle input[type="checkbox"] {
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  /* ---------- Status badges ---------- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge::before { content: "●"; font-size: 9px; }
  .badge.ok { background: #e9f7ef; color: #2f9e64; }
  .badge.stale { background: #fdf1e3; color: #c17d2e; }
  .badge.none { background: #f0f0f0; color: #888; }
  .badge.fail { background: #fde8e8; color: #e04b4b; }
  .badge.progress { background: #ece8fb; color: #6c5ce7; }
  .badge.progress::before { content: ""; }
  .course-tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: #f0f0f0; color: #777; }
  .course-tag.active { background: #eef7ff; color: #2e79c9; }
  .course-tag.ended { background: #f2f2f2; color: #aaa; }

  /* ---------- Desktop table ---------- */
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  th { background: #fafafa; color: #888; font-weight: 600; font-size: 11px; }
  tr:last-child td { border-bottom: none; }
  .student-header td { background: #f7f5ff; cursor: pointer; }
  .student-header .chev { display: inline-block; width: 14px; }
  .reg-row.collapsed { display: none; }
  .sub-meta { font-size: 11px; color: #999; margin-top: 2px; }

  button.action {
    background: #6c5ce7;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  button.action:disabled { background: #ccc; cursor: default; }
  button.action.retry { background: #fff; color: #e04b4b; border: 1px solid #e04b4b; }
  button.secondary {
    background: #eee; color: #555; border: none; margin-left: 6px;
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  button.secondary:disabled { color: #bbb; cursor: default; }
  a.link { color: #6c5ce7; font-size: 12px; text-decoration: none; }

  .error-toggle { font-size: 11px; color: #e04b4b; text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; margin-top: 4px; display: inline-block; }
  .error-detail { font-size: 11px; color: #a33; background: #fdf3f3; border-radius: 6px; padding: 6px 8px; margin-top: 4px; display: none; white-space: pre-wrap; }
  .error-detail.open { display: block; }

  .status { font-size: 12px; color: #888; }
  .loading, .empty { text-align: center; padding: 40px; color: #888; }

  /* ---------- Mobile cards ---------- */
  .mobile-view { display: none; }
  .m-student-card { background: #fff; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
  .m-student-head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; background: #f7f5ff; cursor: pointer; }
  .m-student-head .name { font-weight: 700; font-size: 14px; }
  .m-student-head .meta { font-size: 11px; color: #888; margin-top: 2px; }
  .m-reg { padding: 12px 14px; border-top: 1px solid #f0f0f0; }
  .m-reg-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .m-reg-title { font-weight: 600; font-size: 13px; }
  .m-reg-sub { font-size: 11px; color: #999; margin-bottom: 8px; }
  .m-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .m-actions button { flex: 1 1 auto; min-height: 38px; }
  .m-actions .action { flex: 1 1 100%; }
  .m-actions .secondary { flex: 1 1 auto; margin-left: 0; }
  .m-reg.collapsed { display: none; }

  /* ---------- Confirm modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-overlay.active { display: flex; }
  .modal-box { background: #fff; border-radius: 14px; padding: 22px 20px; max-width: 340px; width: 100%; }
  .modal-box h3 { margin: 0 0 8px; font-size: 15px; }
  .modal-box p { font-size: 13px; color: #666; line-height: 1.5; margin: 0 0 18px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 14px; border-radius: 8px; font-size: 13px; border: none; cursor: pointer; }
  .modal-actions .confirm { background: #6c5ce7; color: #fff; }
  .modal-actions .cancel { background: #eee; color: #555; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; z-index: 60; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .desktop-view { display: none; }
    .mobile-view { display: block; }
    .filter-bar { flex-direction: column; }
    .filter-bar select { width: 100%; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>🔒 관리자 로그인</h1>
    <p>학생 리포트 관리 화면에 접근하려면<br>관리자 비밀번호를 입력하세요</p>
    <input type="password" id="login-input" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button id="login-btn" onclick="submitLogin()">로그인</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <div class="container">
    <div class="app-bar">
      <div>
        <h1>📋 학생 리포트 관리</h1>
        <div class="last-fetch" id="last-fetch">-</div>
      </div>
      <div class="app-bar-actions">
        <button onclick="loadStudents()">🔄 새로고침</button>
        <button class="logout" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="🔍 학생·학교·클래스 검색" oninput="onFilterChange()">
      <select id="filter-course" onchange="onFilterChange()">
        <option value="all">수강상태 전체</option>
        <option value="수강 중">수강 중</option>
        <option value="수강 예정">수강 예정</option>
        <option value="수강 종료">수강 종료</option>
      </select>
      <select id="filter-report" onchange="onFilterChange()">
        <option value="all">보고서 상태 전체</option>
        <option value="ok">최신</option>
        <option value="stale">갱신 필요</option>
        <option value="none">미생성</option>
        <option value="fail">실패</option>
      </select>
      <select id="sort-select" onchange="onFilterChange()">
        <option value="recent">최근 갱신순</option>
        <option value="old">오래된순</option>
        <option value="name">가나다순</option>
      </select>
      <label class="today-only-toggle">
        <input type="checkbox" id="filter-today" onchange="onFilterChange()">
        오늘 수업만
      </label>
    </div>

    <div id="app"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <h3>⚠️ 보고서를 최신화할까요?</h3>
    <p>최신화하면 새 링크가 발급되어<br><strong>기존 학부모 링크는 더 이상 사용할 수 없습니다.</strong><br>계속하시겠습니까?</p>
    <div class="modal-actions">
      <button class="cancel" onclick="closeConfirmModal()">취소</button>
      <button class="confirm" onclick="confirmRefresh()">최신화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://xcokusmqndfbsvlwquxr.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhjb2t1c21xbmRmYnN2bHdxdXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTk0NDcsImV4cCI6MjEwMzM3NTQ0N30.0vavFiupJD1fP8o5HKwIawEQoJUc3wz-RPCtFOyJBwU"
const ADMIN_KEY_STORAGE = "admin_key"
const LAST_ACTIVITY_STORAGE = "admin_last_activity"
const FILTER_STORAGE = "admin_filters"
const COLLAPSE_STORAGE = "admin_collapsed_groups"
const STALE_DAYS = 7
const AUTO_LOGOUT_MINUTES = 20

function esc(s) {
  if (s === null || s === undefined) return ""
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]))
}

function showToast(msg) {
  const t = document.getElementById("toast")
  t.textContent = msg
  t.classList.add("show")
  setTimeout(() => t.classList.remove("show"), 1800)
}

// ---------------- Auth / login screen ----------------
function getAdminKey() {
  return sessionStorage.getItem(ADMIN_KEY_STORAGE) || ""
}

function markActivity() {
  sessionStorage.setItem(LAST_ACTIVITY_STORAGE, String(Date.now()))
}

function checkAutoLogout() {
  const last = Number(sessionStorage.getItem(LAST_ACTIVITY_STORAGE) || 0)
  if (!last) return
  const idleMs = Date.now() - last
  if (idleMs > AUTO_LOGOUT_MINUTES * 60 * 1000) {
    logout(true)
  }
}

function showLoginScreen(errorMsg) {
  document.getElementById("login-screen").style.display = "flex"
  document.getElementById("app-screen").style.display = "none"
  document.getElementById("login-error").textContent = errorMsg || ""
  document.getElementById("login-input").value = ""
  setTimeout(() => document.getElementById("login-input").focus(), 50)
}

function showAppScreen() {
  document.getElementById("login-screen").style.display = "none"
  document.getElementById("app-screen").style.display = "block"
  markActivity()
  loadStudents()
}

async function submitLogin() {
  const input = document.getElementById("login-input")
  const key = input.value.trim()
  const btn = document.getElementById("login-btn")
  const errEl = document.getElementById("login-error")
  if (!key) {
    errEl.textContent = "비밀번호를 입력하세요."
    return
  }
  btn.disabled = true
  btn.textContent = "확인 중..."
  errEl.textContent = ""
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-students`, {
      headers: {
        "x-admin-key": key,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
    })
    if (res.status === 401) {
      errEl.textContent = "비밀번호가 올바르지 않습니다."
      btn.disabled = false
      btn.textContent = "로그인"
      return
    }
    if (!res.ok) throw new Error(`서버 오류: ${res.status}`)
    sessionStorage.setItem(ADMIN_KEY_STORAGE, key)
    markActivity()
    showAppScreen()
  } catch (err) {
    errEl.textContent = "로그인에 실패했습니다: " + err.message
  } finally {
    btn.disabled = false
    btn.textContent = "로그인"
  }
}

function logout(silent) {
  sessionStorage.removeItem(ADMIN_KEY_STORAGE)
  sessionStorage.removeItem(LAST_ACTIVITY_STORAGE)
  showLoginScreen(silent ? "장시간 사용하지 않아 자동 로그아웃되었습니다." : "")
}

document.getElementById("login-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitLogin()
})
;["click", "keydown", "scroll", "input"].forEach((evt) => {
  document.addEventListener(evt, () => { if (getAdminKey()) markActivity() }, { passive: true })
})
setInterval(checkAutoLogout, 30 * 1000)

// ---------------- Data / formatting helpers ----------------
function formatDate(iso) {
  if (!iso) return "생성 안 됨"
  const d = new Date(iso)
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`
}

function relativeFromNow(iso) {
  if (!iso) return ""
  const diffMs = Date.now() - new Date(iso).getTime()
  const days = Math.floor(diffMs / (24 * 60 * 60 * 1000))
  if (days <= 0) return "오늘"
  if (days === 1) return "1일 전"
  return `${days}일 전`
}

function reportUrl(token) {
  return `${window.location.origin}${window.location.pathname.replace("admin.html","")}student_report.html?token=${token}`
}

// 보고서 상태를 계산합니다: fail(오류) > none(미생성) > stale(갱신 필요, 마지막 갱신 7일 초과) > ok(최신)
function reportStatus(s) {
  if (s.error || s.lastError) return "fail"
  if (!s.accessToken) return "none"
  if (s.updatedAt) {
    const days = (Date.now() - new Date(s.updatedAt).getTime()) / (24 * 60 * 60 * 1000)
    if (days > STALE_DAYS) return "stale"
  }
  return "ok"
}

const STATUS_LABEL = { ok: "최신", stale: "갱신 필요", none: "미생성", fail: "실패" }

function statusBadgeHtml(status) {
  return `<span class="badge ${status}">${STATUS_LABEL[status]}</span>`
}

function courseTagHtml(status) {
  const cls = status === "수강 중" ? "active" : status === "수강 종료" ? "ended" : ""
  return `<span class="course-tag ${cls}">${esc(status || "-")}</span>`
}

function actionLabel(status) {
  if (status === "none") return "보고서 생성"
  if (status === "fail") return "다시 시도"
  return "최신화" // ok, stale
}

// ---------------- Load & render ----------------
let STUDENTS = [] // flat list from the server, kept for lookups by index
let PENDING_REFRESH = null // { index, registrationId } awaiting confirm-modal decision

const ACTIVE_STATUS = "수강 중"

function loadFilters() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(FILTER_STORAGE) || "{}")
    document.getElementById("search-input").value = saved.query || ""
    document.getElementById("filter-course").value = saved.course || "all"
    document.getElementById("filter-report").value = saved.report || "all"
    document.getElementById("sort-select").value = saved.sort || "recent"
    document.getElementById("filter-today").checked = !!saved.todayOnly
  } catch (e) { /* ignore */ }
}

function currentFilters() {
  return {
    query: document.getElementById("search-input").value.trim().toLowerCase(),
    course: document.getElementById("filter-course").value,
    report: document.getElementById("filter-report").value,
    sort: document.getElementById("sort-select").value,
    todayOnly: document.getElementById("filter-today").checked,
  }
}

function saveFilters() {
  sessionStorage.setItem(FILTER_STORAGE, JSON.stringify(currentFilters()))
}

function onFilterChange() {
  saveFilters()
  renderAll()
}

// 기본값은 "모두 접힘"입니다. 사용자가 펼친 그룹만 이 목록에 기록됩니다.
function loadExpandedSet() {
  try { return new Set(JSON.parse(sessionStorage.getItem(COLLAPSE_STORAGE) || "[]")) }
  catch (e) { return new Set() }
}
function saveExpandedSet(set) {
  sessionStorage.setItem(COLLAPSE_STORAGE, JSON.stringify([...set]))
}
function toggleGroupCollapse(key) {
  const set = loadExpandedSet()
  if (set.has(key)) set.delete(key); else set.add(key)
  saveExpandedSet(set)
  renderAll()
}

async function loadStudents() {
  const app = document.getElementById("app")
  app.innerHTML = '<div class="loading">불러오는 중...</div>'
  const adminKey = getAdminKey()
  if (!adminKey) {
    showLoginScreen()
    return
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-students`, {
      headers: {
        "x-admin-key": adminKey,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
    })
    if (res.status === 401) {
      logout()
      return
    }
    if (!res.ok) throw new Error(`서버 오류: ${res.status} ${await res.text()}`)

    const data = await res.json()
    STUDENTS = data.students || []
    document.getElementById("last-fetch").textContent = `마지막 조회: ${formatDate(new Date().toISOString())}`
    renderAll()
  } catch (err) {
    app.innerHTML = `<div class="empty">오류: ${esc(err.message)}</div>`
  }
}

function groupByStudent(students) {
  const order = []
  const map = new Map()
  students.forEach((s, i) => {
    const key = s.studentName || s.title || s.registrationId
    if (!map.has(key)) {
      map.set(key, [])
      order.push(key)
    }
    map.get(key).push(i)
  })
  return order.map((key) => ({ studentName: key, indices: map.get(key) }))
}

function studentMetaLine(s) {
  return [s.school, s.grade].filter(Boolean).join(" · ")
}

function matchesFilters(s, filters) {
  if (filters.course !== "all" && s.status !== filters.course) return false
  if (filters.report !== "all" && reportStatus(s) !== filters.report) return false
  if (filters.todayOnly && !s.hasClassToday) return false
  if (filters.query) {
    const haystack = [s.studentName, s.title, s.school, s.grade, s.teacherName].filter(Boolean).join(" ").toLowerCase()
    if (!haystack.includes(filters.query)) return false
  }
  return true
}

function renderAll() {
  const filters = currentFilters()
  renderStats(STUDENTS)
  const filteredIndices = STUDENTS.map((s, i) => i).filter((i) => matchesFilters(STUDENTS[i], filters))
  renderList(filteredIndices, filters)
}

function renderStats(students) {
  const groups = groupByStudent(students)
  const counts = { ok: 0, stale: 0, none: 0, fail: 0 }
  students.forEach((s) => { counts[reportStatus(s)]++ })
  document.getElementById("stats").innerHTML = `
    <div class="stat-card tot"><div class="num">${groups.length}</div><div class="label">전체 학생</div></div>
    <div class="stat-card tot"><div class="num">${students.length}</div><div class="label">전체 등록</div></div>
    <div class="stat-card ok"><div class="num">${counts.ok}</div><div class="label">최신</div></div>
    <div class="stat-card stale"><div class="num">${counts.stale}</div><div class="label">갱신 필요</div></div>
    <div class="stat-card none"><div class="num">${counts.none}</div><div class="label">미생성</div></div>
    <div class="stat-card fail"><div class="num">${counts.fail}</div><div class="label">생성 실패</div></div>
  `
}

function sortIndices(indices, students, sort) {
  const arr = [...indices]
  if (sort === "name") {
    arr.sort((a, b) => (students[a].studentName || "").localeCompare(students[b].studentName || "", "ko"))
  } else {
    arr.sort((a, b) => {
      const ta = students[a].updatedAt ? new Date(students[a].updatedAt).getTime() : 0
      const tb = students[b].updatedAt ? new Date(students[b].updatedAt).getTime() : 0
      return sort === "old" ? ta - tb : tb - ta
    })
  }
  return arr
}

function renderList(filteredIndices, filters) {
  const app = document.getElementById("app")
  if (!STUDENTS.length) {
    app.innerHTML = '<div class="empty">학생 목록이 비어 있습니다. 등록(학원) DB 데이터베이스 ID 설정을 확인해주세요.</div>'
    return
  }
  if (!filteredIndices.length) {
    app.innerHTML = '<div class="empty">검색·필터 조건에 맞는 등록이 없습니다.</div>'
    return
  }

  // Build groups restricted to filtered indices, preserving student grouping.
  const allGroups = groupByStudent(STUDENTS)
  const filteredSet = new Set(filteredIndices)
  const groups = allGroups
    .map((g) => ({ ...g, indices: g.indices.filter((i) => filteredSet.has(i)) }))
    .filter((g) => g.indices.length)
    .map((g) => ({ ...g, indices: sortIndices(g.indices, STUDENTS, filters.sort) }))

  if (filters.sort === "name") {
    groups.sort((a, b) => a.studentName.localeCompare(b.studentName, "ko"))
  } else {
    groups.sort((a, b) => {
      const ta = Math.max(...a.indices.map((i) => STUDENTS[i].updatedAt ? new Date(STUDENTS[i].updatedAt).getTime() : 0))
      const tb = Math.max(...b.indices.map((i) => STUDENTS[i].updatedAt ? new Date(STUDENTS[i].updatedAt).getTime() : 0))
      return filters.sort === "old" ? ta - tb : tb - ta
    })
  }

  const expanded = loadExpandedSet()

  app.innerHTML = `
    <div class="desktop-view">
      <table>
        <thead>
          <tr><th>학생 / 등록</th><th>수강상태</th><th>보고서 상태</th><th>마지막 갱신</th><th>링크</th><th>작업</th></tr>
        </thead>
        <tbody>
          ${groups.map((g, gi) => renderDesktopGroup(g, gi, expanded)).join("")}
        </tbody>
      </table>
    </div>
    <div class="mobile-view">
      ${groups.map((g, gi) => renderMobileGroup(g, gi, expanded)).join("")}
    </div>
  `
}

function renderDesktopGroup(g, gi, expanded) {
  const groupKey = `g-${g.studentName}`
  const isCollapsed = !expanded.has(groupKey)
  const activeCount = g.indices.filter((i) => STUDENTS[i].status === ACTIVE_STATUS).length
  const first = STUDENTS[g.indices[0]]
  const metaLine = studentMetaLine(first)
  return `
    <tr class="student-header" onclick="toggleGroupCollapse(${JSON.stringify(groupKey)})">
      <td colspan="5">
        <span class="chev">${isCollapsed ? "▶" : "▼"}</span>
        <strong>${esc(g.studentName)}</strong>
        <span class="status">${metaLine ? esc(metaLine) + " · " : ""}등록 ${g.indices.length}건${activeCount ? `, 수강중 ${activeCount}` : ""}</span>
      </td>
      <td onclick="event.stopPropagation()">
        <button class="action" id="syncall-${gi}" onclick='syncAllForStudent(${gi})' ${activeCount ? "" : "disabled"}>전체 동기화</button>
      </td>
    </tr>
    ${g.indices.map((i) => renderDesktopRow(i, isCollapsed)).join("")}
  `
}

function renderDesktopRow(i, isCollapsed) {
  const s = STUDENTS[i]
  const status = reportStatus(s)
  const errMsg = s.error || s.lastError
  return `
    <tr id="row-${i}" class="reg-row${isCollapsed ? " collapsed" : ""}">
      <td style="padding-left:28px">
        ${esc(s.title || s.registrationId)}
        ${s.teacherName ? `<div class="sub-meta">담당: ${esc(s.teacherName)}</div>` : ""}
      </td>
      <td>${courseTagHtml(s.status)}</td>
      <td id="statuscell-${i}">
        ${statusBadgeHtml(status)}
        ${errMsg ? `<button class="error-toggle" onclick='toggleError(${i})'>오류 상세</button><div class="error-detail" id="errdetail-${i}">${esc(errMsg)}</div>` : ""}
      </td>
      <td class="status" id="updated-${i}">${formatDate(s.updatedAt)}${s.updatedAt ? `<div class="sub-meta">${relativeFromNow(s.updatedAt)}</div>` : ""}</td>
      <td id="link-${i}">${s.accessToken ? `<a class="link" href="${reportUrl(s.accessToken)}" target="_blank">보기</a>` : "-"}</td>
      <td>
        <button class="action ${status === "fail" ? "retry" : ""}" id="btn-${i}" onclick='onActionClick(${i})'>${actionLabel(status)}</button>
        <button class="secondary" id="copy-${i}" onclick='copyLink(${JSON.stringify(s.accessToken || "")})' ${s.accessToken ? "" : "disabled"}>링크 복사</button>
      </td>
    </tr>
  `
}

function renderMobileGroup(g, gi, expanded) {
  const groupKey = `g-${g.studentName}`
  const isCollapsed = !expanded.has(groupKey)
  const first = STUDENTS[g.indices[0]]
  const metaLine = studentMetaLine(first)
  return `
    <div class="m-student-card">
      <div class="m-student-head" onclick="toggleGroupCollapse(${JSON.stringify(groupKey)})">
        <div>
          <div class="name">${esc(g.studentName)}</div>
          <div class="meta">${metaLine ? esc(metaLine) + " · " : ""}등록 ${g.indices.length}건</div>
        </div>
        <span class="chev">${isCollapsed ? "▶" : "▼"}</span>
      </div>
      ${g.indices.map((i) => renderMobileReg(i, isCollapsed)).join("")}
    </div>
  `
}

function renderMobileReg(i, isCollapsed) {
  const s = STUDENTS[i]
  const status = reportStatus(s)
  const errMsg = s.error || s.lastError
  return `
    <div class="m-reg${isCollapsed ? " collapsed" : ""}" id="mrow-${i}">
      <div class="m-reg-top">
        <div class="m-reg-title">${esc(s.title || s.registrationId)}</div>
        ${statusBadgeHtml(status)}
      </div>
      <div class="m-reg-sub">
        ${courseTagHtml(s.status)}
        ${s.teacherName ? ` · 담당 ${esc(s.teacherName)}` : ""}
        ${s.updatedAt ? ` · ${formatDate(s.updatedAt)} (${relativeFromNow(s.updatedAt)})` : ""}
      </div>
      ${errMsg ? `<button class="error-toggle" onclick='toggleError(${i}, true)'>오류 상세</button><div class="error-detail" id="errdetail-m-${i}">${esc(errMsg)}</div>` : ""}
      <div class="m-actions">
        <button class="action ${status === "fail" ? "retry" : ""}" id="mbtn-${i}" onclick='onActionClick(${i})'>${actionLabel(status)}</button>
        ${s.accessToken ? `<a class="link" style="align-self:center" href="${reportUrl(s.accessToken)}" target="_blank">보기</a>` : ""}
        <button class="secondary" onclick='copyLink(${JSON.stringify(s.accessToken || "")})' ${s.accessToken ? "" : "disabled"}>링크 복사</button>
      </div>
    </div>
  `
}

function toggleError(i, mobile) {
  const el = document.getElementById(mobile ? `errdetail-m-${i}` : `errdetail-${i}`)
  if (el) el.classList.toggle("open")
}

// ---------------- Actions: generate / refresh / retry ----------------
function onActionClick(index) {
  const s = STUDENTS[index]
  const status = reportStatus(s)
  if (status === "ok" || status === "stale") {
    // Refreshing an existing report invalidates the old parent link — confirm first.
    PENDING_REFRESH = index
    document.getElementById("confirm-modal").classList.add("active")
    return
  }
  generateReport(index)
}

function closeConfirmModal() {
  PENDING_REFRESH = null
  document.getElementById("confirm-modal").classList.remove("active")
}

function confirmRefresh() {
  const index = PENDING_REFRESH
  document.getElementById("confirm-modal").classList.remove("active")
  PENDING_REFRESH = null
  if (index !== null && index !== undefined) generateReport(index)
}

function setRowBusy(index, label) {
  const btn = document.getElementById(`btn-${index}`)
  const mbtn = document.getElementById(`mbtn-${index}`)
  ;[btn, mbtn].forEach((b) => { if (b) { b.disabled = true; b.textContent = label } })
}

function setRowIdle(index, label) {
  const btn = document.getElementById(`btn-${index}`)
  const mbtn = document.getElementById(`mbtn-${index}`)
  ;[btn, mbtn].forEach((b) => { if (b) { b.disabled = false; b.textContent = label } })
}

// 같은 학생의 "수강 중"인 등록만 순서대로 동기화합니다. 수강 종료/대기 등록은 건너뜁니다.
async function syncAllForStudent(groupIndex) {
  const filters = currentFilters()
  const filteredIndices = STUDENTS.map((s, i) => i).filter((i) => matchesFilters(STUDENTS[i], filters))
  const allGroups = groupByStudent(STUDENTS)
  const filteredSet = new Set(filteredIndices)
  const groups = allGroups
    .map((g) => ({ ...g, indices: g.indices.filter((i) => filteredSet.has(i)) }))
    .filter((g) => g.indices.length)
  const group = groups[groupIndex]
  if (!group) return
  const targets = group.indices.filter((i) => STUDENTS[i].status === ACTIVE_STATUS)
  const syncAllBtn = document.getElementById(`syncall-${groupIndex}`)
  if (syncAllBtn) { syncAllBtn.disabled = true; syncAllBtn.textContent = `동기화 중... (0/${targets.length})` }
  let done = 0
  for (const i of targets) {
    await generateReport(i, true)
    done++
    if (syncAllBtn) syncAllBtn.textContent = `동기화 중... (${done}/${targets.length})`
  }
  if (syncAllBtn) {
    syncAllBtn.textContent = `✅ 완료 (${targets.length}건)`
    setTimeout(() => { syncAllBtn.disabled = false; syncAllBtn.textContent = "전체 동기화" }, 1500)
  }
}

async function generateReport(index, silent) {
  const s = STUDENTS[index]
  setRowBusy(index, "생성 중...")
  const adminKey = getAdminKey()

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/sync-student-report`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ registrationId: s.registrationId }),
    })
    if (!res.ok) throw new Error(`실패: ${res.status} ${await res.text()}`)
    const result = await res.json()

    s.accessToken = result.access_token
    s.updatedAt = new Date().toISOString()
    delete s.error
    delete s.lastError

    setRowIdle(index, "✅ 완료")
    if (!silent) showToast("보고서가 최신화되었습니다.")
    setTimeout(() => renderAll(), 900)
  } catch (err) {
    s.error = err.message
    setRowIdle(index, actionLabel("fail"))
    if (!silent) alert("오류: " + err.message)
    renderAll()
  }
}

function copyLink(token) {
  if (!token) return
  navigator.clipboard.writeText(reportUrl(token))
  showToast("링크가 복사되었습니다.")
}

// ---------------- Boot ----------------
;(function boot() {
  loadFilters()
  checkAutoLogout()
  if (getAdminKey()) {
    showAppScreen()
  } else {
    showLoginScreen()
  }
})()
</script>
</body>
</html>
