<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 리포트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #f5f6f8;
    color: #222;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
  .header {
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    color: #fff;
    padding: 24px 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }
  .header h1 { margin: 0 0 4px; font-size: 20px; }
  .header p { margin: 0; opacity: 0.9; font-size: 14px; }

  .tabbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    background: #fff;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    user-select: none;
  }
  .tab.active { background: #6c5ce7; color: #fff; }

  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: #eee;
    color: #555;
  }
  .badge.출석 { background: #e6f7ee; color: #1e9e5c; }
  .badge.결석 { background: #fdeaea; color: #e04b4b; }
  .badge.지각, .badge.보강 { background: #fff6e0; color: #b8860b; }
  .list-item {
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .title { font-weight: 600; margin-bottom: 3px; }
  .list-item .meta { color: #888; font-size: 12px; }
  .empty { color: #aaa; font-size: 13px; text-align: center; padding: 12px 0; }
  .loading, .error { text-align: center; padding: 60px 20px; color: #888; }
  .error { color: #e04b4b; }
  .notice {
    background: #fff8e1;
    border-left: 4px solid #f5b400;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .today-highlight { text-align: center; padding: 20px 0; }
  .today-highlight .status {
    display: inline-block;
    font-size: 18px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .today-highlight .date { color: #888; font-size: 13px; }
  .cta {
    display: block;
    width: 100%;
    text-align: center;
    background: #6c5ce7;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .clickable { cursor: pointer; }
  .clickable:active { opacity: 0.6; }

  .cal-weekdays, .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
  }
  .cal-weekdays { font-size: 12px; color: #888; margin-bottom: 6px; }
  .cal-cell {
    position: relative;
    padding: 8px 0;
    font-size: 13px;
    border-radius: 8px;
  }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.has-event { font-weight: 700; background: #f5f3ff; }
  .cal-dot {
    display: block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    margin: 3px auto 0;
    background: #1e9e5c;
  }
  .cal-dot.결석 { background: #e04b4b; }
  .cal-dot.보강 { background: #b8860b; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-sheet {
    background: #fff;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 20px;
  }
  .modal-sheet h3 {
    margin: 0 0 14px;
    font-size: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-sheet h4 {
    font-size: 13px;
    color: #6c5ce7;
    margin: 16px 0 6px;
  }
  .modal-sheet h4:first-of-type { margin-top: 0; }
  .modal-close {
    background: #f0f0f0;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading">불러오는 중...</div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-sheet">
    <h3><span id="modal-title"></span><button class="modal-close" onclick="closeModal()">✕</button></h3>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xcokusmqndfbsvlwquxr.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhjb2t1c21xbmRmYnN2bHdxdXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTk0NDcsImV4cCI6MjEwMzM3NTQ0N30.0vavFiupJD1fP8o5HKwIawEQoJUc3wz-RPCtFOyJBwU"

const app = document.getElementById("app")
let currentData = null

function esc(s) {
  if (s === null || s === undefined) return ""
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]))
}

async function loadReport() {
  const params = new URLSearchParams(window.location.search)
  const token = params.get("token")

  if (!token) {
    app.innerHTML = '<div class="error">잘못된 링크입니다. (토큰 없음)</div>'
    return
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_report_by_token`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ p_token: token }),
    })

    if (!res.ok) throw new Error(`서버 오류: ${res.status}`)

    let data = await res.json()
    if (Array.isArray(data)) data = data[0]

    if (!data) {
      app.innerHTML = '<div class="error">리포트를 찾을 수 없습니다. 링크를 다시 확인해주세요.</div>'
      return
    }

    render(data)
  } catch (err) {
    app.innerHTML = `<div class="error">오류가 발생했습니다: ${esc(err.message)}</div>`
  }
}

function buildCalendarHtml(d) {
  const attendanceRows = d.attendance_rows || []
  const studyLogs = d.study_logs || []
  const homework = d.homework || []
  const tests = d.tests || []

  const refDate = d.updated_at ? new Date(d.updated_at) : new Date()
  const year = refDate.getFullYear()
  const month = refDate.getMonth()

  const firstDay = new Date(year, month, 1)
  const daysInMonth = new Date(year, month + 1, 0).getDate()
  const startWeekday = firstDay.getDay()

  const eventsByDate = {}
  const addEvent = (iso, type) => {
    if (!iso) return
    const key = iso.slice(0, 10)
    if (!eventsByDate[key]) eventsByDate[key] = []
    eventsByDate[key].push(type)
  }
  attendanceRows.forEach((r) => addEvent(r.iso, r.status || "출석"))
  studyLogs.forEach((l) => addEvent(l.iso, "학습"))
  homework.forEach((h) => addEvent(h.due_iso, "과제"))
  tests.forEach((t) => addEvent(t.iso, "평가"))

  let cells = ""
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty">-</div>`
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`
    const events = eventsByDate[iso] || []
    const dotClass = events.includes("결석") ? "결석" : events.includes("보강") ? "보강" : ""
    cells += `<div class="cal-cell ${events.length ? "has-event clickable" : ""}" ${events.length ? `onclick='openDayDetail(${JSON.stringify(iso)})'` : ""}>
      <span>${day}</span>
      ${events.length ? `<span class="cal-dot ${dotClass}"></span>` : ""}
    </div>`
  }

  return `
    <div class="card">
      <h2>📅 ${month + 1}월 캘린더</h2>
      <div class="cal-weekdays">
        ${["일","월","화","수","목","금","토"].map((w) => `<div>${w}</div>`).join("")}
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
  `
}

function openDayDetail(iso) {
  const d = currentData
  if (!d) return
  const att = (d.attendance_rows || []).find((r) => r.iso && r.iso.slice(0,10) === iso)
  const logs = (d.study_logs || []).filter((l) => l.iso && l.iso.slice(0,10) === iso)
  const hw = (d.homework || []).filter((h) => h.due_iso && h.due_iso.slice(0,10) === iso)
  const tests = (d.tests || []).filter((t) => t.iso && t.iso.slice(0,10) === iso)

  const html = `
    ${att ? `<h4>✅ 출석</h4><div class="list-item"><span class="badge ${esc(att.status)}">${esc(att.status)}</span> ${esc(att.in || "")} ~ ${esc(att.out || "")}</div>` : ""}
    ${logs.length ? `<h4>📖 학습</h4>${logs.map((l) => `<div class="list-item"><div class="title">${esc(l.book)} ${esc(l.range)}</div><div class="meta">단원: ${esc(l.unit || "-")}</div></div>`).join("")}` : ""}
    ${hw.length ? `<h4>📝 과제 마감</h4>${hw.map((h) => `<div class="list-item"><div class="title">${esc(h.title)}</div></div>`).join("")}` : ""}
    ${tests.length ? `<h4>🎯 평가</h4>${tests.map((t) => `<div class="list-item"><div class="title">${esc(t.title)}</div><div class="meta">정답 ${t.correct}/${t.total}</div></div>`).join("")}` : ""}
    ${!att && !logs.length && !hw.length && !tests.length ? '<div class="empty">이 날짜에 기록된 내용이 없습니다.</div>' : ""}
  `
  document.getElementById("modal-title").textContent = iso
  document.getElementById("modal-body").innerHTML = html
  document.getElementById("modal").classList.add("active")
}

function render(d) {
  currentData = d

  const schedule = d.schedule || []
  const books = d.books || []
  const attendanceSummary = d.attendance_summary || {}
  const attendanceRows = d.attendance_rows || []
  const studyLogs = d.study_logs || []
  const homework = d.homework || []
  const tests = d.tests || []
  const teacherComments = d.teacher_comments || []
  const notices = d.notices || []

  const latestAttendance = attendanceRows[0]
  const latestStudy = studyLogs[0]

  app.innerHTML = `
    <div class="header">
      <h1>${esc(d.student_name)} 학생 학습 리포트</h1>
      <p>${esc(d.school_grade || "")} · ${esc(d.class_name || "")} ${d.class_mode ? "· " + esc(d.class_mode) : ""}</p>
      <p>담당 강사: ${esc(d.teacher_name || "-")}</p>
    </div>

    <div class="tabbar">
      <div class="tab active" id="tab-today" onclick="switchView('today')">오늘 학습</div>
      <div class="tab" id="tab-home" onclick="switchView('home')">학생 홈</div>
    </div>

    <div class="view active" id="view-today">
      ${notices.length ? notices.map((n) => `<div class="notice">${esc(typeof n === "string" ? n : n.body || n.title)}</div>`).join("") : ""}

      <div class="card">
        <div class="today-highlight">
          <div class="status badge ${esc(latestAttendance ? latestAttendance.status : "")}">${latestAttendance ? esc(latestAttendance.status) : "출석 기록 없음"}</div>
          <div class="date">${latestAttendance ? esc(latestAttendance.date) + " (" + esc(latestAttendance.weekday || "") + ")" : ""}</div>
        </div>
      </div>

      <div class="card">
        <h2>📖 오늘의 학습 내용</h2>
        ${latestStudy ? `
          <div class="list-item">
            <div class="title">${esc(latestStudy.book || "")} ${esc(latestStudy.range || "")}</div>
            <div class="meta">${esc(latestStudy.date)} · 단원: ${esc(latestStudy.unit || "-")}</div>
          </div>
        ` : '<div class="empty">오늘 등록된 학습 기록이 없습니다.</div>'}
      </div>

      ${teacherComments.length ? `
      <div class="card">
        <h2>💬 선생님 코멘트</h2>
        <div class="list-item">
          <div class="title">${esc(teacherComments[0].text)}</div>
          <div class="meta">${esc(teacherComments[0].date || "")} · ${esc(teacherComments[0].by || "")}</div>
        </div>
      </div>` : ""}

      <button class="cta" onclick="switchView('home')">학생 홈 전체 보기 →</button>
    </div>

    <div class="view" id="view-home">
      ${schedule.length ? `
      <div class="card">
        <h2>🗓 시간표</h2>
        ${schedule.map((s) => `
          <div class="row"><span>${esc(s.day || s.weekday || "")}</span><span>${esc(s.start || "")}${s.end ? " ~ " + esc(s.end) : ""}</span></div>
        `).join("")}
      </div>` : ""}

      ${books.length ? `
      <div class="card">
        <h2>📚 진도 교재</h2>
        ${books.map((b) => {
          const title = typeof b === "string" ? b : b.title
          return `
          <div class="row clickable" onclick='openBookDetail(${JSON.stringify(title)})'>
            <span>${esc(title)} ›</span>
            <span>${esc(typeof b === "string" ? "" : (b.progress != null ? b.progress + "%" : ""))}</span>
          </div>`
        }).join("")}
      </div>` : ""}

      ${buildCalendarHtml(d)}

      <div class="card">
        <h2>✅ 출석 현황</h2>
        <div class="row"><span>출석</span><span>${attendanceSummary.present ?? 0}회</span></div>
        <div class="row"><span>결석</span><span>${attendanceSummary.absent ?? 0}회</span></div>
        <div class="row"><span>보강</span><span>${attendanceSummary.makeup ?? 0}회</span></div>
        ${attendanceRows.length ? attendanceRows.map((r) => `
          <div class="row clickable" ${r.iso ? `onclick='openDayDetail(${JSON.stringify(r.iso.slice(0,10))})'` : ""}><span>${esc(r.date)} (${esc(r.weekday || "")})</span><span><span class="badge ${esc(r.status)}">${esc(r.status)}</span></span></div>
        `).join("") : '<div class="empty">최근 출석 기록이 없습니다.</div>'}
      </div>

      <div class="card">
        <h2>📖 최근 학습 기록</h2>
        ${studyLogs.length ? studyLogs.map((l) => `
          <div class="list-item">
            <div class="title">${esc(l.book || "")} ${esc(l.range || "")}</div>
            <div class="meta">${esc(l.date)} · 단원: ${esc(l.unit || "-")}</div>
          </div>
        `).join("") : '<div class="empty">최근 학습 기록이 없습니다.</div>'}
      </div>

      ${homework.length ? `
      <div class="card">
        <h2>📝 과제</h2>
        ${homework.map((h) => `
          <div class="list-item">
            <div class="title">${esc(h.title)}</div>
            <div class="meta">마감: ${esc(h.due || "-")} · 상태: <span class="badge">${esc(h.status)}</span></div>
          </div>
        `).join("")}
      </div>` : ""}

      ${tests.length ? `
      <div class="card">
        <h2>🎯 평가 결과</h2>
        ${tests.map((t) => `
          <div class="list-item">
            <div class="title">${esc(t.title)}</div>
            <div class="meta">${esc(t.date)} · 정답 ${t.correct ?? 0} / ${t.total ?? 0}</div>
          </div>
        `).join("")}
      </div>` : ""}

      ${teacherComments.length ? `
      <div class="card">
        <h2>💬 선생님 코멘트 전체</h2>
        ${teacherComments.map((c) => `
          <div class="list-item">
            <div class="title">${esc(c.text)}</div>
            <div class="meta">${esc(c.date || "")} · ${esc(c.by || "")}</div>
          </div>
        `).join("")}
      </div>` : ""}
    </div>
  `
}

function openBookDetail(bookTitle) {
  const d = currentData
  if (!d) return
  const logs = (d.study_logs || []).filter((l) => l.book === bookTitle)
  const hw = (d.homework || []).filter((h) => h.book === bookTitle)
  const tests = (d.tests || []).filter((t) => t.book === bookTitle)

  const html = `
    ${logs.length ? `
      <h4>📖 학습 기록</h4>
      ${logs.map((l) => `<div class="list-item"><div class="title">${esc(l.range || "")}</div><div class="meta">${esc(l.date)} · 단원: ${esc(l.unit || "-")}</div></div>`).join("")}
    ` : ""}
    ${hw.length ? `
      <h4>📝 과제</h4>
      ${hw.map((h) => `<div class="list-item"><div class="title">${esc(h.title)}</div><div class="meta">마감: ${esc(h.due || "-")} · ${esc(h.status)}</div></div>`).join("")}
    ` : ""}
    ${tests.length ? `
      <h4>🎯 평가</h4>
      ${tests.map((t) => `<div class="list-item"><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.date)} · 정답 ${t.correct ?? 0}/${t.total ?? 0}</div></div>`).join("")}
    ` : ""}
    ${!logs.length && !hw.length && !tests.length ? '<div class="empty">이 교재와 관련된 기록이 없습니다.</div>' : ""}
  `

  document.getElementById("modal-title").textContent = bookTitle
  document.getElementById("modal-body").innerHTML = html
  document.getElementById("modal").classList.add("active")
}

function closeModal() {
  document.getElementById("modal").classList.remove("active")
}

function switchView(view) {
  document.getElementById("view-today").classList.toggle("active", view === "today")
  document.getElementById("view-home").classList.toggle("active", view === "home")
  document.getElementById("tab-today").classList.toggle("active", view === "today")
  document.getElementById("tab-home").classList.toggle("active", view === "home")
  window.scrollTo({ top: 0, behavior: "smooth" })
}

loadReport()
</script>
</body>
</html>
