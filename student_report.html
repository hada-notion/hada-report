<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 리포트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #f5f6f8;
    color: #222;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .header {
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    color: #fff;
    padding: 24px 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }
  .header h1 { margin: 0 0 4px; font-size: 20px; }
  .header p { margin: 0; opacity: 0.9; font-size: 14px; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.출석 { background: #e6f7ee; color: #1e9e5c; }
  .badge.결석 { background: #fdeaea; color: #e04b4b; }
  .badge.지각, .badge.보강 { background: #fff6e0; color: #b8860b; }
  .list-item {
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .title { font-weight: 600; margin-bottom: 3px; }
  .list-item .meta { color: #888; font-size: 12px; }
  .empty { color: #aaa; font-size: 13px; text-align: center; padding: 12px 0; }
  .loading, .error {
    text-align: center;
    padding: 60px 20px;
    color: #888;
  }
  .error { color: #e04b4b; }
  .notice {
    background: #fff8e1;
    border-left: 4px solid #f5b400;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading">불러오는 중...</div>
</div>

<script>
const SUPABASE_URL = "https://xcokusmqndfbsvlwquxr.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhjb2t1c21xbmRmYnN2bHdxdXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTk0NDcsImV4cCI6MjEwMzM3NTQ0N30.0vavFiupJD1fP8o5HKwIawEQoJUc3wz-RPCtFOyJBwU"

const app = document.getElementById("app")

function esc(s) {
  if (s === null || s === undefined) return ""
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]))
}

function badgeClass(status) {
  if (!status) return ""
  return esc(status)
}

async function loadReport() {
  const params = new URLSearchParams(window.location.search)
  const token = params.get("token")

  if (!token) {
    app.innerHTML = '<div class="error">잘못된 링크입니다. (토큰 없음)</div>'
    return
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_report_by_token`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ p_token: token }),
    })

    if (!res.ok) {
      throw new Error(`서버 오류: ${res.status}`)
    }

    let data = await res.json()
    if (Array.isArray(data)) data = data[0]

    if (!data) {
      app.innerHTML = '<div class="error">리포트를 찾을 수 없습니다. 링크를 다시 확인해주세요.</div>'
      return
    }

    render(data)
  } catch (err) {
    app.innerHTML = `<div class="error">오류가 발생했습니다: ${esc(err.message)}</div>`
  }
}

function render(d) {
  const schedule = d.schedule || []
  const books = d.books || []
  const attendanceSummary = d.attendance_summary || {}
  const attendanceRows = d.attendance_rows || []
  const studyLogs = d.study_logs || []
  const homework = d.homework || []
  const tests = d.tests || []
  const teacherComments = d.teacher_comments || []
  const notices = d.notices || []

  app.innerHTML = `
    <div class="header">
      <h1>${esc(d.student_name)} 학생 학습 리포트</h1>
      <p>${esc(d.school_grade || "")} · ${esc(d.class_name || "")} ${d.class_mode ? "· " + esc(d.class_mode) : ""}</p>
      <p>담당 강사: ${esc(d.teacher_name || "-")}</p>
      ${d.period_label ? `<p>${esc(d.period_label)}</p>` : ""}
    </div>

    ${notices.length ? `
    <div class="card">
      <h2>📢 공지사항</h2>
      ${notices.map((n) => `<div class="notice">${esc(typeof n === "string" ? n : n.content)}</div>`).join("")}
    </div>` : ""}

    ${schedule.length ? `
    <div class="card">
      <h2>🗓 시간표</h2>
      ${schedule.map((s) => `
        <div class="row">
          <span>${esc(s.weekday || s.day || "")}</span>
          <span>${esc(s.time || "")}</span>
        </div>
      `).join("")}
    </div>` : ""}

    ${books.length ? `
    <div class="card">
      <h2>📚 진도 교재</h2>
      ${books.map((b) => `
        <div class="row">
          <span>${esc(typeof b === "string" ? b : b.title)}</span>
          <span>${esc(typeof b === "string" ? "" : (b.progress || ""))}</span>
        </div>
      `).join("")}
    </div>` : ""}

    <div class="card">
      <h2>✅ 출석 현황</h2>
      <div class="row"><span>출석</span><span>${attendanceSummary.present ?? 0}회</span></div>
      <div class="row"><span>결석</span><span>${attendanceSummary.absent ?? 0}회</span></div>
      <div class="row"><span>보강</span><span>${attendanceSummary.makeup ?? 0}회</span></div>
      ${attendanceRows.length ? attendanceRows.map((r) => `
        <div class="row">
          <span>${esc(r.date)} (${esc(r.weekday || "")})</span>
          <span><span class="badge ${badgeClass(r.status)}">${esc(r.status)}</span></span>
        </div>
      `).join("") : '<div class="empty">최근 출석 기록이 없습니다.</div>'}
    </div>

    <div class="card">
      <h2>📖 최근 학습 기록</h2>
      ${studyLogs.length ? studyLogs.map((l) => `
        <div class="list-item">
          <div class="title">${esc(l.book || "")} ${esc(l.range || "")}</div>
          <div class="meta">${esc(l.date)} · 단원: ${esc(l.unit || "-")}</div>
        </div>
      `).join("") : '<div class="empty">최근 학습 기록이 없습니다.</div>'}
    </div>

    ${homework.length ? `
    <div class="card">
      <h2>📝 과제</h2>
      ${homework.map((h) => `
        <div class="list-item">
          <div class="title">${esc(h.title)}</div>
          <div class="meta">마감: ${esc(h.due || "-")} · 상태: <span class="badge">${esc(h.status)}</span></div>
        </div>
      `).join("")}
    </div>` : ""}

    ${tests.length ? `
    <div class="card">
      <h2>🎯 평가 결과</h2>
      ${tests.map((t) => `
        <div class="list-item">
          <div class="title">${esc(t.title)}</div>
          <div class="meta">${esc(t.date)} · 정답 ${t.correct ?? 0} / ${t.total ?? 0}</div>
        </div>
      `).join("")}
    </div>` : ""}

    ${teacherComments.length ? `
    <div class="card">
      <h2>💬 선생님 코멘트</h2>
      ${teacherComments.map((c) => `
        <div class="list-item">
          <div class="title">${esc(c.text)}</div>
          <div class="meta">${esc(c.date || "")} · ${esc(c.by || "")}</div>
        </div>
      `).join("")}
    </div>` : ""}
  `
}

loadReport()
</script>
</body>
</html>
